server.port=${PORT:8081}

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/avento_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Nitin@2004}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Firebase Configuration
avento.firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:serviceAccountKey.json}

# Logging
logging.level.com.avento=${LOGGING_LEVEL_AVENTO:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}

# Razorpay Test / Production Mode Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:rzp_secret_placeholder}
razorpay.currency=${RAZORPAY_CURRENCY:INR}

# Google OAuth 2.0 Credentials
google.client.id=${GOOGLE_CLIENT_ID:your_google_client_id.apps.googleusercontent.com}
google.client.secret=${GOOGLE_CLIENT_SECRET:your_google_client_secret}

# Spring Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:notifications@avento.io}
spring.mail.password=${SPRING_MAIL_PASSWORD:mock_smtp_secret_pass}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cloudinary & Local File Upload Configuration
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:avento-cloud}
cloudinary.api_key=${CLOUDINARY_API_KEY:984128471928412}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:SecretAventoCloudinaryApiSecret123}
avento.upload.dir=${AVENTO_UPLOAD_DIR:uploads}

# Swagger OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

