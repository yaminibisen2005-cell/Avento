server.port=8081

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/avento_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Firebase Configuration
avento.firebase.service-account-path=serviceAccountKey.json

# Logging
logging.level.com.avento=DEBUG
logging.level.org.springframework.security=INFO

# Razorpay Test Mode Configuration
razorpay.key.id=rzp_test_AVENTO12345678
razorpay.key.secret=SecretKeyForAventoTesting1234
razorpay.currency=INR

# Spring Mail Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=notifications@avento.io
spring.mail.password=mock_smtp_secret_pass
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Cloudinary & Local File Upload Configuration
cloudinary.cloud_name=avento-cloud
cloudinary.api_key=984128471928412
cloudinary.api_secret=SecretAventoCloudinaryApiSecret123
avento.upload.dir=uploads

# Swagger OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

